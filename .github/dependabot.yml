# Dependabot configuration for @nestarc/outbox.
#
# Two ecosystems are watched:
#   1. npm           — devDependencies and peer-ranged packages. Grouped
#                      by domain so a single PR updates all NestJS/@types
#                      packages together instead of opening 10+ PRs.
#   2. github-actions— action versions in .github/workflows/*. These
#                      rarely change but a stale @v3 action can silently
#                      break a deprecation deadline.
#
# Schedule is weekly (Monday morning Seoul time) so PRs don't overwhelm
# the author. Minor/patch updates are grouped; major bumps are ignored
# by Dependabot and should be handled as explicit compatibility work.

version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Seoul
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - npm
    commit-message:
      prefix: chore(deps)
      include: scope
    groups:
      nestjs:
        patterns:
          - '@nestjs/*'
        update-types:
          - minor
          - patch
      types:
        patterns:
          - '@types/*'
        update-types:
          - minor
          - patch
      eslint-and-prettier:
        patterns:
          - 'eslint*'
          - '@typescript-eslint/*'
          - 'prettier*'
        update-types:
          - minor
          - patch
      jest:
        patterns:
          - 'jest'
          - 'ts-jest'
          - '@types/jest'
        update-types:
          - minor
          - patch
      prisma:
        patterns:
          - 'prisma'
          - '@prisma/*'
        update-types:
          - minor
          - patch
    ignore:
      # Major bumps are compatibility work for a library with peer ranges.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Seoul
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: chore(ci)
      include: scope
    groups:
      github-actions:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
