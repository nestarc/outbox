name: CI

# Runs on every push to main and every pull request targeting main.
#
# Three stages:
#   1. lint  — fast static checks (eslint + type-check). Fails early before
#              burning matrix CI minutes.
#   2. test  — Node 22/24 legacy and modern runtime tuples run unit + e2e + coverage.
#              The primary modern cell also installs the packed tarball into
#              an isolated strict consumer and exercises it against PostgreSQL.
#              Gated behind
#              lint so invalid code never reaches the matrix.
#              PostgreSQL service container provides a real database for E2E.
#   3. pack  — clean build + `npm pack --dry-run` to prove the tarball is
#              publish-ready. Single job because the output is identical
#              across the matrix.
#
# Security notes:
#   - No `${{ github.event.* }}` values are interpolated into `run:` shells.
#     The only templated expressions are `${{ matrix.* }}` (trusted, defined
#     in this file) and `${{ github.ref }}` (trusted, from the GitHub runner
#     environment). This avoids the workflow-injection class of bugs.
#   - Default permissions are reduced to `contents: read`.
#   - `concurrency` cancels superseded commits on the same ref.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check (src)
        run: npx tsc --noEmit -p tsconfig.build.json

      - name: Compatibility policy
        run: npm run test:compatibility-policy

      - name: Workflow policy
        run: npm run test:workflow-policy

      - name: Production dependency audit
        run: npm run audit:production

  test:
    name: Test (Node ${{ matrix.node }} x NestJS ${{ matrix.nestjs }} x Prisma ${{ matrix.prisma }})
    needs: lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: outbox_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U test -d outbox_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        include:
          - node: '22'
            nestjs: '10.4.22'
            schedule: '4.1.2'
            prisma: '5.22.0'
          - node: '22'
            nestjs: '10.4.22'
            schedule: '4.1.2'
            prisma: '6.19.3'
          - node: '22'
            nestjs: '11.2.3'
            schedule: '5.0.1'
            prisma: '7.10.0'
          - node: '24'
            nestjs: '11.2.3'
            schedule: '5.0.1'
            prisma: '7.10.0'
          - node: '22'
            nestjs: '12.0.1'
            schedule: '12.0.1'
            prisma: '7.10.0'
          - node: '24'
            nestjs: '12.0.1'
            schedule: '12.0.1'
            prisma: '7.10.0'

    env:
      DATABASE_URL: postgresql://test:test@localhost:5433/outbox_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install exact runtime tuple
        env:
          OUTBOX_PRISMA_VERSION: ${{ matrix.prisma }}
        run: |
          # A second --no-save install resets the first tuple to package.json.
          # Install the optional legacy/modern adapter in the same operation.
          OUTBOX_ADAPTER_ARGS=()
          if [ "$OUTBOX_PRISMA_VERSION" != '5.22.0' ]; then
            OUTBOX_ADAPTER_ARGS+=("@prisma/adapter-pg@$OUTBOX_PRISMA_VERSION")
          fi
          npm install --no-save --strict-peer-deps --no-audit --no-fund \
            @nestjs/common@${{ matrix.nestjs }} \
            @nestjs/core@${{ matrix.nestjs }} \
            @nestjs/platform-express@${{ matrix.nestjs }} \
            @nestjs/testing@${{ matrix.nestjs }} \
            @nestjs/schedule@${{ matrix.schedule }} \
            prisma@${{ matrix.prisma }} \
            @prisma/client@${{ matrix.prisma }} \
            "${OUTBOX_ADAPTER_ARGS[@]}"

      - name: Assert exact runtime tuple
        run: |
          node scripts/assert-installed-versions.js \
            "@nestjs/common@${{ matrix.nestjs }}" \
            "@nestjs/core@${{ matrix.nestjs }}" \
            "@nestjs/schedule@${{ matrix.schedule }}" \
            "prisma@${{ matrix.prisma }}" \
            "@prisma/client@${{ matrix.prisma }}"

      - name: Assert exact Prisma driver adapter
        if: matrix.prisma != '5.22.0'
        run: node scripts/assert-installed-versions.js "@prisma/adapter-pg@${{ matrix.prisma }}"

      - name: Unit tests
        run: npm test

      - name: E2E tests
        run: npm run test:e2e

      - name: Strict packed modern consumer with PostgreSQL
        if: matrix.node == '22' && matrix.nestjs == '11.2.3' && matrix.prisma == '7.10.0'
        run: npm run test:modern-consumer

      - name: Strict packed package exports consumer without optional pg
        if: matrix.node == '22' && matrix.nestjs == '11.2.3' && matrix.prisma == '7.10.0'
        run: npm run test:package-exports

      - name: Strict packed README examples with and without optional pg
        if: matrix.node == '22' && matrix.nestjs == '11.2.3' && matrix.prisma == '7.10.0'
        run: npm run test:packed-examples

      - name: Strict packed Prisma 5 consumer with PostgreSQL
        if: matrix.node == '22' && matrix.nestjs == '10.4.22' && matrix.prisma == '5.22.0'
        run: npm run test:prisma5-consumer

      - name: Strict packed Prisma 6 consumer with PostgreSQL
        if: matrix.node == '22' && matrix.nestjs == '10.4.22' && matrix.prisma == '6.19.3'
        run: npm run test:prisma6-consumer

      - name: Strict packed NestJS 12 consumer with PostgreSQL
        if: matrix.nestjs == '12.0.1'
        run: npm run test:nest12-consumer

      - name: Coverage (primary cell only)
        if: matrix.node == '24' && matrix.nestjs == '12.0.1' && matrix.prisma == '7.10.0'
        run: npm run test:cov

      - name: Upload coverage artifact
        if: matrix.node == '24' && matrix.nestjs == '12.0.1' && matrix.prisma == '7.10.0'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}-node${{ matrix.node }}-nest${{ matrix.nestjs }}-prisma${{ matrix.prisma }}-${{ github.run_attempt }}
          path: coverage/
          if-no-files-found: error
          retention-days: 14

  pack:
    name: Pack (publish dry-run)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Pack (dry run)
        run: npm pack --dry-run

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  node26-canary:
    name: Node 26 pre-LTS canary (allowed failure)
    continue-on-error: true
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: outbox_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U test -d outbox_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test:test@localhost:5433/outbox_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 26
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Strict packed NestJS 12 consumer with PostgreSQL
        run: npm run test:nest12-consumer
